<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact form for Landscaping Hobby Guide.">
  <link rel="stylesheet" href="styles.css">
  <title>Landscaping Hobby Guide | Contact</title>
</head>
<body>
  <header>
    <h1>Landscaping Hobby Guide</h1>
    <nav>
      <a href="index.html">Home</a> |
      <a href="about.html">About</a> |
      <a href="beginner-guide.html">Beginner Guide</a> |
      <a href="resources.html">Resources</a> |
      <a href="soil-basics.html">Soil Basics</a> |
      <a href="plant-selection.html">Plant Selection</a> |
      <a href="layout-planning.html">Layout Planning</a> |
      <a href="maintenance.html">Maintenance</a> |
      <a href="contact.html">Contact</a>
      <a href="demo.html">Demo</a>   
    </nav>
    <hr>
  </header>

  <main>
    <figure>
      <img src="banner.jpg" alt="Landscaping Hobby Guide banner showing a garden scene">
    </figure>

    <h2>Contact</h2>
    <p>Use this form to ask a landscaping question or request a plant recommendation.</p>

    <form id="contactForm">
      <label for="name"><strong>Name</strong></label><br>
      <input id="name" name="name" type="text" required><br><br>

      <label for="email"><strong>Email</strong></label><br>
      <input id="email" name="email" type="email" required><br><br>

      <label for="topic"><strong>Topic</strong></label><br>
      <select id="topic" name="topic" required>
        <option value="">Select one</option>
        <option value="plant">Plant recommendation</option>
        <option value="soil">Soil / drainage</option>
        <option value="layout">Layout planning</option>
        <option value="maintenance">Maintenance</option>
      </select><br><br>

      <label for="message"><strong>Message</strong></label><br>
      <textarea id="message" name="message" rows="5" required></textarea><br><br>

      <button type="submit">Submit</button>
    </form>

    <p id="formStatus" style="display:none;"></p>
  </main>

  <footer>
    <hr>
    <p>Course project site</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
